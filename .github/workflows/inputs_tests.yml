name: "Security regression tests"

on:
  pull_request:
  push:
    branches: [upstream-community]
  workflow_dispatch:

jobs:
  inputs-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install Ansible"
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: "Run input validation tests"
        run: |
          ansible-playbook tests/validation/test_input_validation.yml \
            -i localhost, \
            --connection=local
        env:
          ANSIBLE_ROLES_PATH: "./roles:./upstream/roles"
