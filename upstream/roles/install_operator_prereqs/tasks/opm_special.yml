- name: "Stop previous opm container"
  shell: "{{ container_tool }} rm -f {{ opm_container_name }}"
  failed_when: false
  changed_when: false
  no_log: true

- name: "Pull the opm image {{ opm_image }}"
  shell: "{{ container_tool }} pull {{ opm_image }}"
  register: rf_pull_opm_image

- name: "Create the opm image"
  shell: "{{ container_tool }} create --name {{ opm_container_name }} {{ opm_image }}"
  register: rf_pull_opm_image

- name: "Copy from {{ opm_container_name }}:/{{ opm_bin_source_path }}"
  shell: "{{ container_tool }} cp {{ opm_container_name }}:/{{ opm_bin_source_path }} {{ opm_bin_path }}"

- name: "Compute checksum of extracted opm binary"
  stat:
    path: "{{ opm_bin_path }}"
    checksum_algorithm: sha256
  register: rf_opm_binary_stat

- name: "Verify opm binary checksum"
  assert:
    that:
      - "'sha256:' + rf_opm_binary_stat.stat.checksum == opm_checksum"
    fail_msg: "Checksum mismatch for {{ opm_bin_path }}: expected {{ opm_checksum }}, got sha256:{{ rf_opm_binary_stat.stat.checksum }}"
    success_msg: "opm binary checksum verified: {{ opm_checksum }}"

- name: "Make opm executable"
  shell: "chmod +x {{ opm_bin_path }}"
  failed_when: false

- name: "Remove local opm image {{ opm_image }}"
  shell: "{{ container_tool }} rmi -f {{ opm_image }}"
